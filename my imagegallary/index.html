<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Image Gallery</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>📸 My Image Gallery</h1>
        <p>Explore beautiful images</p>
    </header>

    <!-- Category Buttons -->

    <div class="filters">
        <button onclick="filterImages('all')">All</button>
        <button onclick="filterImages('nature')">Nature</button>
        <button onclick="filterImages('city')">City</button>
        <button onclick="filterImages('travel')">Travel</button>
    </div>

    <!-- Gallery -->

    <div class="gallery">

        <div class="image-card nature">
            <img src="https://picsum.photos/id/1015/600/400"
                 onclick="openLightbox(this)">
        </div>

        <div class="image-card nature">
            <img src="https://picsum.photos/id/1016/600/400"
                 onclick="openLightbox(this)">
        </div>

        <div class="image-card city">
            <img src="https://picsum.photos/id/1011/600/400"
                 onclick="openLightbox(this)">
        </div>

        <div class="image-card city">
            <img src="https://picsum.photos/id/1031/600/400"
                 onclick="openLightbox(this)">
        </div>

        <div class="image-card travel">
            <img src="https://picsum.photos/id/1035/600/400"
                 onclick="openLightbox(this)">
        </div>

        <div class="image-card travel">
            <img src="https://picsum.photos/id/1043/600/400"
                 onclick="openLightbox(this)">
        </div>

    </div>

    <!-- Lightbox -->

    <div id="lightbox" class="lightbox">

        <span class="close" onclick="closeLightbox()">&times;</span>

        <button class="prev" onclick="changeImage(-1)">❮</button>

        <img id="lightbox-img">

        <button class="next" onclick="changeImage(1)">❯</button>

    </div>

    <script src="script.js"></script>

</body>
</html>
